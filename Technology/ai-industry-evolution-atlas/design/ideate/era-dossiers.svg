<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="7" r=".45" fill="#202522" opacity=".05"/><circle cx="14" cy="13" r=".35" fill="#202522" opacity=".04"/></pattern>
    <style>.serif{font-family:Georgia,serif;fill:#202522}.sans{font-family:Arial,sans-serif;fill:#202522}.mono{font-family:'Courier New',monospace;fill:#202522}.muted{fill:#70736d}.tiny{font-size:11px;letter-spacing:.08em}.small{font-size:13px}.rule{stroke:#202522;stroke-opacity:.18}.card{fill:#e8e4d8;stroke:#202522;stroke-opacity:.13}.stamp{fill:none;stroke:#2d7773;stroke-width:1.2}</style>
  </defs>
  <rect width="1440" height="1000" fill="#f3f0e6"/><rect width="1440" height="1000" fill="url(#paper)"/>
  <g transform="translate(64 48)">
    <text class="mono tiny muted">TECHNOLOGY / DOCUMENTARY ATLAS / CONCEPT B</text><text class="mono tiny muted" x="1110">SIX ERA DOSSIERS</text><line class="rule" x1="0" y1="18" x2="1312" y2="18"/>
    <text class="serif" x="0" y="88" font-size="62">The Long Wave of AI</text>
    <text class="sans muted" x="4" y="121" font-size="17">Six case files on how a research field became a global industry.</text>
    <g transform="translate(965 55)"><rect width="347" height="82" rx="4" fill="#202522"/><text x="18" y="25" font-family="Courier New" font-size="11" fill="#d8d4c8">THE 30-SECOND READ</text><text x="18" y="52" font-family="Georgia" font-size="18" fill="#f3f0e6">Progress compounds. Attention cycles.</text><text x="18" y="70" font-family="Arial" font-size="12" fill="#d8d4c8">Open any dossier to inspect the evidence.</text></g>

    <g transform="translate(0 172)">
      <text class="mono tiny muted" x="0">FILTER</text>
      <rect x="58" y="-17" width="94" height="28" rx="14" fill="#202522"/><text x="83" y="2" font-family="Arial" font-size="11" fill="#f3f0e6">ALL ERAS</text>
      <rect x="162" y="-17" width="105" height="28" rx="14" fill="none" stroke="#202522" opacity=".35"/><text class="sans tiny" x="183" y="2">BREAKTHROUGH</text>
      <rect x="277" y="-17" width="82" height="28" rx="14" fill="none" stroke="#202522" opacity=".35"/><text class="sans tiny" x="298" y="2">WINTERS</text>
      <rect x="369" y="-17" width="94" height="28" rx="14" fill="none" stroke="#202522" opacity=".35"/><text class="sans tiny" x="390" y="2">PUBLIC VIEW</text>
      <text class="mono tiny muted" x="1090">COMPARE ERAS +</text>
    </g>

    <g transform="translate(0 214)">
      <!-- Dossier 1 -->
      <g><rect class="card" width="416" height="292" rx="4"/><text class="mono tiny muted" x="18" y="27">DOSSIER 01 / 1950–1969</text><circle class="stamp" cx="365" cy="42" r="24"/><text class="mono" x="350" y="46" font-size="10" fill="#2d7773">PROXY</text><text class="serif" x="18" y="70" font-size="26">The promise</text><text class="sans small muted" x="18" y="94">A field names itself—and predicts rapid success.</text><path d="M18 145 C55 134,77 113,110 120 C148 128,174 88,208 100 C245 113,274 138,310 126 C343 115,371 84,398 75" fill="none" stroke="#2d7773" stroke-width="3"/><line class="rule" x1="18" y1="150" x2="398" y2="150"/><text class="mono tiny muted" x="18" y="176">SELECTED TURNING POINTS</text><text class="sans small" x="18" y="202">1950  Turing reframes machine intelligence</text><text class="sans small" x="18" y="226">1956  Dartmouth establishes the field</text><text class="sans small" x="18" y="250">1966  ELIZA meets the public imagination</text><text class="mono tiny" x="18" y="275">UK · USA  /  OPEN DOSSIER →</text></g>
      <!-- Dossier 2 -->
      <g transform="translate(448 0)"><rect class="card" width="416" height="292" rx="4"/><text class="mono tiny muted" x="18" y="27">DOSSIER 02 / 1970–1982</text><circle cx="365" cy="42" r="24" fill="none" stroke="#b95d4b"/><text x="349" y="46" font-family="Courier New" font-size="9" fill="#b95d4b">MIXED</text><text class="serif" x="18" y="70" font-size="26">Limits surface</text><text class="sans small muted" x="18" y="94">Funding retreats as promises meet constraints.</text><path d="M18 120 C60 111,95 103,130 116 C170 130,196 150,236 158 C276 165,304 177,340 173 C365 170,382 154,398 149" fill="none" stroke="#b95d4b" stroke-width="3"/><line class="rule" x1="18" y1="150" x2="398" y2="150"/><text class="mono tiny muted" x="18" y="176">SELECTED TURNING POINTS</text><text class="sans small" x="18" y="202">1973  Lighthill report challenges progress</text><text class="sans small" x="18" y="226">1974  First AI winter begins</text><text class="sans small" x="18" y="250">1980  Expert systems revive investment</text><text class="mono tiny" x="18" y="275">UK · USA · JAPAN  /  OPEN DOSSIER →</text></g>
      <!-- Dossier 3 -->
      <g transform="translate(896 0)"><rect class="card" width="416" height="292" rx="4"/><text class="mono tiny muted" x="18" y="27">DOSSIER 03 / 1983–1996</text><circle class="stamp" cx="365" cy="42" r="24"/><text class="mono" x="350" y="46" font-size="10" fill="#2d7773">PROXY</text><text class="serif" x="18" y="70" font-size="26">Boom, then winter</text><text class="sans small muted" x="18" y="94">Commercial momentum collapses a second time.</text><path d="M18 142 C56 116,83 84,120 89 C161 94,180 118,214 120 C250 123,270 160,308 169 C347 178,374 167,398 159" fill="none" stroke="#c49b45" stroke-width="3"/><line class="rule" x1="18" y1="150" x2="398" y2="150"/><text class="mono tiny muted" x="18" y="176">SELECTED TURNING POINTS</text><text class="sans small" x="18" y="202">1983  Fifth Generation ambition expands</text><text class="sans small" x="18" y="226">1987  Expert-system market contracts</text><text class="sans small" x="18" y="250">1990s  Statistical methods gather strength</text><text class="mono tiny" x="18" y="275">JAPAN · USA · EUROPE  /  OPEN DOSSIER →</text></g>

      <!-- row 2 -->
      <g transform="translate(0 320)"><rect class="card" width="416" height="292" rx="4"/><text class="mono tiny muted" x="18" y="27">DOSSIER 04 / 1997–2011</text><circle class="stamp" cx="365" cy="42" r="24"/><text class="mono" x="350" y="46" font-size="10" fill="#2d7773">MIXED</text><text class="serif" x="18" y="70" font-size="26">Quiet accumulation</text><text class="sans small muted" x="18" y="94">Data, compute and methods build beneath the surface.</text><path d="M18 152 C57 148,81 143,118 145 C158 146,180 135,218 137 C254 138,282 119,320 124 C351 128,375 112,398 106" fill="none" stroke="#2d7773" stroke-width="3"/><line class="rule" x1="18" y1="150" x2="398" y2="150"/><text class="mono tiny muted" x="18" y="176">SELECTED TURNING POINTS</text><text class="sans small" x="18" y="202">1997  Deep Blue wins the match</text><text class="sans small" x="18" y="226">2006  “Deep learning” gains momentum</text><text class="sans small" x="18" y="250">2009  ImageNet scales visual training data</text><text class="mono tiny" x="18" y="275">GLOBAL LAB NETWORK  /  OPEN DOSSIER →</text></g>
      <g transform="translate(448 320)"><rect class="card" width="416" height="292" rx="4"/><text class="mono tiny muted" x="18" y="27">DOSSIER 05 / 2012–2021</text><circle class="stamp" cx="365" cy="42" r="24"/><text class="mono" x="350" y="46" font-size="10" fill="#2d7773">DIRECT</text><text class="serif" x="18" y="70" font-size="26">Deep learning</text><text class="sans small muted" x="18" y="94">Capability becomes visible to the wider public.</text><path d="M18 155 C58 147,88 142,124 136 C160 130,184 114,220 116 C258 118,281 88,316 91 C352 94,376 61,398 53" fill="none" stroke="#2d7773" stroke-width="3"/><line class="rule" x1="18" y1="150" x2="398" y2="150"/><text class="mono tiny muted" x="18" y="176">SELECTED TURNING POINTS</text><text class="sans small" x="18" y="202">2012  AlexNet changes computer vision</text><text class="sans small" x="18" y="226">2016  AlphaGo becomes a public event</text><text class="sans small" x="18" y="250">2017  Transformer architecture appears</text><text class="mono tiny" x="18" y="275">CANADA · UK · CHINA · USA  /  OPEN →</text></g>
      <g transform="translate(896 320)"><rect width="416" height="292" rx="4" fill="#202522"/><text x="18" y="27" font-family="Courier New" font-size="11" fill="#c9c5ba">DOSSIER 06 / 2022–2026 H1</text><circle cx="365" cy="42" r="24" fill="none" stroke="#f3f0e6"/><text x="350" y="46" font-family="Courier New" font-size="10" fill="#f3f0e6">DIRECT</text><text x="18" y="70" font-family="Georgia" font-size="26" fill="#f3f0e6">Public encounter</text><text x="18" y="94" font-family="Arial" font-size="13" fill="#c9c5ba">Adoption, anxiety and policy move together.</text><path d="M18 157 C55 141,78 104,116 106 C154 108,178 54,218 66 C255 77,278 39,315 46 C350 53,374 27,398 22" fill="none" stroke="#c49b45" stroke-width="3"/><path d="M18 157 C56 167,82 185,120 181 C160 176,184 165,220 171 C258 179,281 196,318 190 C351 185,375 202,398 197" fill="none" stroke="#b95d4b" stroke-width="2"/><line x1="18" y1="150" x2="398" y2="150" stroke="#f3f0e6" opacity=".25"/><text x="18" y="176" font-family="Courier New" font-size="11" fill="#c9c5ba">SELECTED TURNING POINTS</text><text x="18" y="202" font-family="Arial" font-size="13" fill="#f3f0e6">2022  ChatGPT reaches the public</text><text x="18" y="226" font-family="Arial" font-size="13" fill="#f3f0e6">2024  Adoption and regulation accelerate</text><text x="18" y="250" font-family="Arial" font-size="13" fill="#f3f0e6">2026 H1  Partial-year evidence</text><text x="18" y="275" font-family="Courier New" font-size="11" fill="#f3f0e6">GLOBAL / OPEN DOSSIER →</text></g>
    </g>

    <g transform="translate(0 884)"><line class="rule" x1="0" y1="0" x2="1312" y2="0"/><text class="mono tiny muted" x="0" y="28">EVIDENCE STAMPS: DIRECT MEASURE / PROXY / ESTIMATE / EDITORIAL</text><text class="mono tiny muted" x="1020" y="28">METHOD · SOURCES · DOWNLOAD</text></g>
  </g>
